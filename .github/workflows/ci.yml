name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/sim590/dpaste-ci:opendht-3.0.1
      credentials:
        username: sim590
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dpaste
        run: ./autogen.sh && ./configure --enable-tests && make -j"$(nproc)"

      - name: Run unit tests
        run: make test
